name: version check

on:
  push:
    paths:
      - "VERSION"
      - "bin/version.sh"
      - "sim-ops-ng-lib/pyproject.toml"
      - "sim-ops-ng-lib/so/__init__.py"
      - "sim-ops-ng-mcs/package.json"
      - "sim-ops-ng-3dv/package.json"
      - ".github/workflows/version-check.yml"
  pull_request:
    paths:
      - "VERSION"
      - "bin/version.sh"
      - "sim-ops-ng-lib/pyproject.toml"
      - "sim-ops-ng-lib/so/__init__.py"
      - "sim-ops-ng-mcs/package.json"
      - "sim-ops-ng-3dv/package.json"
      - ".github/workflows/version-check.yml"

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check all components match VERSION
        run: sh bin/version.sh check
