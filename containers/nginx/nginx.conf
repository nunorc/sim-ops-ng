
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;

    # Admin Flask app
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    location /admin/ {
        proxy_pass http://sim-ops-ng-admin:9131/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        # outlast TRIGGER_TIMEOUT (so/admin.py, 60 s) so a slow trigger's 504 JSON reaches the page
        proxy_read_timeout 90s;
    }

    # WebSocket endpoint
    location /api/ws {
        proxy_pass http://sim-ops-ng-api:9111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # REST API endpoints
    location = /api {
        return 301 $scheme://$http_host/api/;
    }

    location /api/ {
        proxy_pass http://sim-ops-ng-api:9111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3D Orbit Viewer
    location = /3dv {
        return 301 $scheme://$http_host/3dv/;
    }

    location /3dv/ {
        proxy_pass http://sim-ops-ng-3dv:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

